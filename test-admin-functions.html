<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест функций админ-панели</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-button { margin: 5px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .test-button:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 3px; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .input-group { margin: 10px 0; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input, .input-group select { padding: 5px; width: 200px; }
    </style>
</head>
<body>
    <h1>🧪 Тест функций админ-панели</h1>
    
    <div class="input-group">
        <label>Session ID (получить из браузера после входа в админку):</label>
        <input type="text" id="sessionId" placeholder="Вставьте session ID">
        <button onclick="saveSessionId()">Сохранить</button>
    </div>

    <div class="test-section">
        <h3>📊 Статистика</h3>
        <button class="test-button" onclick="testStats()">Получить статистику</button>
        <div id="stats-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>👥 Пользователи</h3>
        <button class="test-button" onclick="testUsers()">Получить пользователей</button>
        <button class="test-button" onclick="testCreateUser()">Создать тестового пользователя</button>
        <div id="users-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>👨‍🏫 Преподаватели</h3>
        <button class="test-button" onclick="testTeachers()">Получить преподавателей</button>
        <button class="test-button" onclick="testCreateTeacher()">Создать преподавателя</button>
        <div id="teachers-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>📚 Уроки</h3>
        <button class="test-button" onclick="testLessons()">Получить уроки</button>
        <button class="test-button" onclick="testBookings()">Получить заявки</button>
        <div id="lessons-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>💰 Платежи</h3>
        <button class="test-button" onclick="testPayments()">Получить платежи</button>
        <button class="test-button" onclick="testCreatePayment()">Создать тестовый платеж</button>
        <div id="payments-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>📈 Отчеты</h3>
        <button class="test-button" onclick="testReports()">Получить отчет</button>
        <button class="test-button" onclick="testExportReport()">Экспорт отчета</button>
        <div id="reports-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'https://obzatycdwtdmhgqotbgs.supabase.co/functions/v1';
        let sessionId = localStorage.getItem('adminSessionId') || '';
        
        if (sessionId) {
            document.getElementById('sessionId').value = sessionId;
        }

        function saveSessionId() {
            sessionId = document.getElementById('sessionId').value;
            localStorage.setItem('adminSessionId', sessionId);
            showResult('Session ID сохранен!', 'success', 'stats-result');
        }

        function showResult(message, type, elementId) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `result ${type}`;
        }

        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function testStats() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'stats-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=stats&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Статистика получена:\n${JSON.stringify(result.data.stats, null, 2)}`, 'success', 'stats-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'stats-result');
            }
        }

        async function testUsers() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'users-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=users&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Пользователи получены (${result.data.users.length} шт.):\n${JSON.stringify(result.data.users.slice(0, 3), null, 2)}`, 'success', 'users-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'users-result');
            }
        }

        async function testCreateUser() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'users-result');
                return;
            }
            
            const userData = {
                name: 'Тестовый Пользователь',
                phone: '+77777777' + Math.floor(Math.random() * 1000),
                email: 'test' + Math.floor(Math.random() * 1000) + '@example.com',
                role: 'student',
                grade: 8
            };
            
            const result = await apiCall(`/admin?action=create-user&sessionId=${sessionId}`, {
                method: 'POST',
                body: JSON.stringify(userData)
            });
            
            if (result.success && result.data.success) {
                showResult(`✅ Пользователь создан:\n${JSON.stringify(result.data.user, null, 2)}`, 'success', 'users-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'users-result');
            }
        }

        async function testTeachers() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'teachers-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=teachers&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Преподаватели получены (${result.data.teachers.length} шт.):\n${JSON.stringify(result.data.teachers, null, 2)}`, 'success', 'teachers-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'teachers-result');
            }
        }

        async function testCreateTeacher() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'teachers-result');
                return;
            }
            
            const teacherData = {
                name: 'Тестовый Преподаватель',
                phone: '+77777777' + Math.floor(Math.random() * 1000),
                email: 'teacher' + Math.floor(Math.random() * 1000) + '@example.com',
                bio: 'Опытный преподаватель математики',
                subjects: ['math', 'physics'],
                price_per_lesson: 7000,
                password: 'test123456'
            };
            
            const result = await apiCall(`/admin?action=create_teacher&sessionId=${sessionId}`, {
                method: 'POST',
                body: JSON.stringify(teacherData)
            });
            
            if (result.success && result.data.success) {
                showResult(`✅ Преподаватель создан:\nТелефон: ${teacherData.phone}\nПароль: ${teacherData.password}`, 'success', 'teachers-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'teachers-result');
            }
        }

        async function testLessons() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'lessons-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=lessons&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Уроки получены (${result.data.lessons.length} шт.)`, 'success', 'lessons-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'lessons-result');
            }
        }

        async function testBookings() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'lessons-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=bookings&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Заявки получены (${result.data.bookings.length} шт.)`, 'success', 'lessons-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'lessons-result');
            }
        }

        async function testPayments() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'payments-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=payments&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Платежи получены (${result.data.payments.length} шт.)`, 'success', 'payments-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'payments-result');
            }
        }

        async function testCreatePayment() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'payments-result');
                return;
            }
            
            // Сначала получим пользователей для создания платежа
            const usersResult = await apiCall(`/admin?action=users&sessionId=${sessionId}`);
            
            if (!usersResult.success || !usersResult.data.success || usersResult.data.users.length === 0) {
                showResult('❌ Нет пользователей для создания платежа', 'error', 'payments-result');
                return;
            }
            
            const userId = usersResult.data.users[0].id;
            
            const paymentData = {
                userId: userId,
                amount: 7000,
                method: 'manual',
                description: 'Тестовый платеж'
            };
            
            const result = await apiCall(`/admin?action=create-payment&sessionId=${sessionId}`, {
                method: 'POST',
                body: JSON.stringify(paymentData)
            });
            
            if (result.success && result.data.success) {
                showResult(`✅ Платеж создан:\n${JSON.stringify(result.data.payment, null, 2)}`, 'success', 'payments-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'payments-result');
            }
        }

        async function testReports() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'reports-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=reports&period=month&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Отчет получен:\n${JSON.stringify(result.data.report, null, 2)}`, 'success', 'reports-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'reports-result');
            }
        }

        async function testExportReport() {
            if (!sessionId) {
                showResult('Введите Session ID!', 'error', 'reports-result');
                return;
            }
            
            const result = await apiCall(`/admin?action=export-report&format=csv&period=month&sessionId=${sessionId}`);
            
            if (result.success && result.data.success) {
                showResult(`✅ Экспорт: ${result.data.message}`, 'success', 'reports-result');
            } else {
                showResult(`❌ Ошибка: ${result.data?.error || result.error}`, 'error', 'reports-result');
            }
        }
    </script>
</body>
</html>
